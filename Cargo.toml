[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
publish = false
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "AGPL-3.0-or-later"
authors = ["Nikolay Govorov <me@govorov.online>"]
homepage = "https://git.dimidiumlabs.io/gilti"
repository = "https://git.dimidiumlabs.io/gilti"

[workspace.dependencies]
async-compression = { version = "0.4.44", features = ["tokio", "gzip", "bzip2", "xz", "zstd"] }
async-stream = "0.3.6"
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
bytes = "1.12.1"
bytesize = { version = "2.7.0", features = ["serde"] }
git2 = { version = "0.21.0", default-features = false, features = ["unstable-sha256", "vendored-libgit2"] }
libc = "0.2.172"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
maud = "0.27.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
garde = { version = "0.23.0", features = ["derive"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
humantime-serde = "1.1.1"
ipnet = { version = "2.11.0", features = ["serde"] }
serde_yaml_ng = "0.10.0"
toml = "1.0.7"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
