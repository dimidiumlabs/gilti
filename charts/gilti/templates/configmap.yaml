{{- range $name, $value := dict "web.rootTitle" .Values.web.rootTitle "web.rootDescription" .Values.web.rootDescription "web.clonePrefix" .Values.web.clonePrefix }}
{{- if regexMatch "[\\r\\n]" $value }}
{{- fail (printf "%s must be a single line" $name) }}
{{- end }}
{{- end }}
{{- range $key := .Values.ssh.authorizedKeys }}
{{- if or (eq $key "") (regexMatch "[\\r\\n]" $key) }}
{{- fail "ssh.authorizedKeys entries must be non-empty single lines" }}
{{- end }}
{{- end }}
{{- $config := deepCopy .Values.config }}
{{- $server := get $config "server" | default dict }}
{{- $_ := set $server "hostnames" .Values.http.hostnames }}
{{- $_ = set $config "server" $server }}
{{- $instance := get $config "instance" | default dict }}
{{- $_ = set $instance "root_title" .Values.web.rootTitle }}
{{- $_ = set $instance "root_description" .Values.web.rootDescription }}
{{- $_ = set $instance "clone_prefix" .Values.web.clonePrefix }}
{{- $_ = set $config "instance" $instance }}
{{- $access := get $config "access" | default dict }}
{{- $_ = set $access "ssh" .Values.ssh.enabled }}
{{- $_ = set $access "http_write" .Values.http.write }}
{{- $_ = set $config "access" $access }}
{{- $archive := get $config "archive" | default dict }}
{{- $_ = set $archive "formats" .Values.archive.formats }}
{{- $_ = set $config "archive" $archive }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gilti.fullname" . }}
  labels:
    {{- include "gilti.labels" . | nindent 4 }}
data:
  config.json: |
    {{ $config | toPrettyJson | nindent 4 }}
  authorized_keys: |
    {{- range .Values.ssh.authorizedKeys }}
    {{ . }}
    {{- end }}
