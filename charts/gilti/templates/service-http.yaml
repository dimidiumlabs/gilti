apiVersion: v1
kind: Service
metadata:
  name: {{ include "gilti.fullname" . }}-http
  labels:
    {{- include "gilti.labels" . | nindent 4 }}
  {{- with .Values.httpService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.httpService.type }}
  selector:
    {{- include "gilti.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.httpService.port }}
      targetPort: http
      protocol: TCP
