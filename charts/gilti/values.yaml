replicaCount: 1

image:
    repository: ghcr.io/dimidiumlabs/gilti
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

ssh:
    # Expose authenticated Git access through the bundled OpenSSH server.
    enabled: true
    # Every listed key has read/write access to every repository.
    authorizedKeys: []

web:
    rootTitle: Gilti
    rootDescription: A small, fast, independent Git server
    clonePrefix: ""

http:
    # HTTP authorities accepted by Gilti. An empty list disables host filtering.
    hostnames: []
    # Allow unauthenticated Git receive-pack and LFS uploads.
    write: false

archive:
    formats: [tar, tar.gz, tar.bz2, tar.xz, tar.zst, zip]

# Advanced typed application settings. Keys use the snake_case names from
# config/gilti.toml; chart-level web/http/ssh/archive values take precedence.
config: {}

persistence:
    enabled: true
    existingClaim: ""
    retain: true
    accessModes: [ReadWriteOnce]
    size: 10Gi
    storageClass: ""

httpService:
    type: ClusterIP
    port: 80
    annotations: {}

sshService:
    type: ClusterIP
    port: 22
    annotations: {}
    externalTrafficPolicy: ""

httpRoute:
    enabled: false
    hostnames: []
    parentRefs: []

sshRoute:
    enabled: false
    apiVersion: gateway.networking.k8s.io/v1
    parentRefs: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
    seccompProfile:
        type: RuntimeDefault

# OpenSSH keeps a root master and drops to UID/GID 10000 for Git sessions.
securityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
        drop: [ALL]
        add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SYS_CHROOT]

resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        memory: 1Gi

runtime:
    runSizeLimit: 32Mi
    tmpSizeLimit: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30
