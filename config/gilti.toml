[instance]
root_title = "Gilti"
root_description = "A small, fast, independent Git server"

clone_prefix = ""

[server]
addr = "0.0.0.0:8080"
hostnames = []

header_read_timeout = "10s"
request_body_idle_timeout = "60s"
request_body_max_bytes = "1GiB"
trusted_proxies = []
http1_max_buffer_bytes = "32KiB"
http2_max_concurrent_streams = 64
http2_max_header_list_bytes = "16KiB"

compression_level = 5
compression_min_bytes = "128B"

max_queued_requests = 128
max_concurrent_requests = 64

admission_wait = "1s"
shutdown_timeout = "25s"

[git_storage]
home = "/var/lib/gilti/git"
repositories = "/var/lib/gilti/git/repositories"

[git]
executable = "/usr/bin/git"
http_backends = ["/usr/libexec/git-core/git-http-backend", "/usr/lib/git-core/git-http-backend"]
receive_pack = "/usr/bin/git-receive-pack"
upload_archive = "/usr/bin/git-upload-archive"
upload_pack = "/usr/bin/git-upload-pack"
executable_path = "/usr/bin:/bin"
global_config = "/dev/null"
max_repository_name_bytes = "1KiB"
http_response_header_max_bytes = "64KiB"

[lfs]
max_object_bytes = "1GiB"
batch_request_max_bytes = "1MiB"
verify_request_max_bytes = "64KiB"

[browser]
repositories_per_page = 50
log_commits_per_page = 50
feed_commits = 10
summary_refs = 10
summary_commits = 10
description_chars = 80
diff_default_context = 3
diff_max_context = 40
stats_default_authors = 10
stats_author_options = [10, 25, 50, 100]
binary_detection_bytes = "8000B"
abbreviated_oid_chars = 7

[access]
ssh = true
http_write = false

[archive]
formats = ["tar", "tar.gz", "tar.bz2", "tar.xz", "tar.zst", "zip"]
stream_buffer_bytes = "64KiB"
gzip_level = 6
bzip2_level = 9
xz_level = 6
zstd_level = 3
