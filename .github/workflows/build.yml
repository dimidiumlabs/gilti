name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gilti-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: nightly

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: false
      - name: Install dependencies
        run: mise bootstrap --locked --yes --update
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: formatting
        run: cargo fmt --all --check

      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: false
      - name: Install dependencies
        run: mise bootstrap --locked --yes --update
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - run: cargo clippy --workspace --locked --all-targets --all-features --release -- -D warnings
      - run: cargo test --all-features --release --locked
      - run: tests/chart.sh

      # Build on the native GitHub runner so rust-cache can reuse the release
      # dependencies already compiled by the checks above.  Do not compile in a
      # disposable Alpine target directory: the UI toolchain is expensive and
      # that directory is deliberately removed after every invocation.
      - name: Build container artifacts
        run: scripts/build-artifacts.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: binary-${{ matrix.arch }}
          path: .container/binary-${{ matrix.arch }}/
          if-no-files-found: error

  image:
    name: Image and smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: binary-amd64
          path: .container/binary-amd64
      - name: Build local image
        run: |
          mise run container -- \
            --tag gilti:ci \
            --build-arg VERSION=ci \
            --build-arg REVISION=${{ github.sha }} \
            --provenance false \
            --sbom false \
            --load
      - name: Smoke test
        run: IMAGE=gilti:ci tests/smoke.sh

  publish:
    name: Publish image and chart
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: binary-*
          path: .container
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF#refs/tags/v}
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "release tag is not a supported SemVer: $version" >&2
              exit 1
            }
            image_tag=${version//+/_}
          else
            version="0.0.0-nightly.$(git log -1 --format=%ct)"
            image_tag=nightly
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >>"$GITHUB_OUTPUT"
      - name: Publish OCI image
        run: |
          mise run container -- \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/dimidiumlabs/gilti:${{ steps.version.outputs.image_tag }} \
            --tag ghcr.io/dimidiumlabs/gilti:sha-${GITHUB_SHA} \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg REVISION=${GITHUB_SHA} \
            --cache-scope gilti \
            --push
      - name: Publish OCI chart
        run: |
          mise run chart -- \
            --chart charts/gilti \
            --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.version }} \
            --push oci://ghcr.io/dimidiumlabs/charts
