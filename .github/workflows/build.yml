name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gilti-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: true
          cache: true
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: shellcheck scripts/*.sh tests/*.sh
      - run: tests/chart.sh

  image:
    name: Image and smoke test
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: false
      - name: Build local image
        run: |
          mise run container -- \
            --tag gilti:ci \
            --build-arg VERSION=ci \
            --build-arg REVISION=${{ github.sha }} \
            --provenance false \
            --sbom false \
            --load
      - name: Smoke test
        run: IMAGE=gilti:ci tests/smoke.sh

  publish:
    name: Publish image and chart
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.7.5
          experimental: true
          install: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF#refs/tags/v}
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "release tag is not a supported SemVer: $version" >&2
              exit 1
            }
            image_tag=${version//+/_}
          else
            version="0.0.0-nightly.$(git log -1 --format=%ct)"
            image_tag=nightly
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >>"$GITHUB_OUTPUT"
      - name: Publish OCI image
        run: |
          mise run container -- \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/dimidiumlabs/gilti:${{ steps.version.outputs.image_tag }} \
            --tag ghcr.io/dimidiumlabs/gilti:sha-${GITHUB_SHA} \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg REVISION=${GITHUB_SHA} \
            --cache-scope gilti \
            --push
      - name: Publish OCI chart
        run: |
          mise run chart -- \
            --chart charts/gilti \
            --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.version }} \
            --push oci://ghcr.io/dimidiumlabs/charts
